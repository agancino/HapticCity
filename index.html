<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Haptic City - Demostración Háptica</title>
    <meta name="description" content="Demostración académica interactiva de tecnología háptica y audio espacial urbano desarrollada con Phaser 3.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;800&display=swap">
    <!-- Main Style -->
    <link rel="stylesheet" href="style.css?v=10.0">
    <!-- Phaser 3 Local Library -->
    <script src="phaser.min.js?v=10.0"></script>
</head>
<body>
    <div id="app-wrapper">
        <!-- Game Canvas Container -->
        <div id="game-container"></div>

        <!-- HTML UI Overlay for Menu & Controls -->
        <div id="ui-overlay">
            <!-- Menu Screen Overlay -->
            <div id="menu-screen" class="ui-screen">
                <h1 class="game-title">HAPTIC CITY</h1>
                <p class="game-subtitle">Demostración de Audio Urbano para Sistema Háptico</p>
                
                <div class="info-card">
                    <p>🎯 <strong>Modo Autocontrol:</strong> El personaje avanza solo por las calles.</p>
                    <p>⏱️ Cada 7s se detiene 7s a escuchar un sonido (Claxon, Sirena o Alarma).</p>
                    <p>📱 Audios captados por la app Android para activar la pulsera háptica.</p>
                </div>

                <div class="menu-buttons">
                    <button id="btn-start" class="btn btn-primary">▶ INICIAR DEMO AUTOMÁTICA</button>
                    <button id="btn-restart" class="btn btn-secondary">🔄 REINICIAR DEMO</button>
                    <button id="btn-mute" class="btn btn-secondary">🔊 AUDIO: ACTIVADO</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Audios del usuario embebidos -->
    <script src="assets/sounds/sounds-data.js?v=10.0"></script>
    <!-- Game Scripts con Recarga Forzada -->
    <script src="src/InputManager.js?v=10.0"></script>
    <script src="src/MobileControls.js?v=10.0"></script>
    <script src="src/LoadingScene.js?v=10.0"></script>
    <script src="src/MenuScene.js?v=10.0"></script>
    <script src="src/Map.js?v=10.0"></script>
    <script src="src/Player.js?v=10.0"></script>
    <script src="src/AudioManager.js?v=10.0"></script>
    <script src="src/GameScene.js?v=10.0"></script>
    <script src="main.js?v=10.0"></script>

    <!-- Escuchador táctil universal para móviles y tablets -->
    <script>
        function launchGameFromMobile() {
            var menuScreen = document.getElementById('menu-screen');
            if (menuScreen) menuScreen.classList.add('hidden');
            if (window.hapticCityGameInstance) {
                try {
                    if (window.hapticCityGameInstance.sound && window.hapticCityGameInstance.sound.context) {
                        window.hapticCityGameInstance.sound.context.resume();
                    }
                } catch(e) {}
                window.hapticCityGameInstance.scene.start('GameScene');
            }
        }

        var btnStart = document.getElementById('btn-start');
        if (btnStart) {
            btnStart.addEventListener('touchstart', function(e) {
                e.preventDefault();
                launchGameFromMobile();
            }, { passive: false });
            btnStart.addEventListener('click', function(e) {
                launchGameFromMobile();
            });
        }
    </script>
</body>
</html>
